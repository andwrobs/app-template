name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  starter:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: starter/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm test
      - run: npx vitest run --root .. --dir ../maintainers --environment node
  app-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: references/app-reference
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: references/app-reference/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3"
      - run: npm ci
      - run: npm run check
