# https://lefthook.dev/configuration/
# Hooks install from the repository root, so the starter's check runs from here.
# starter/lefthook.yml is the copy apps receive.
pre-commit:
  commands:
    starter:
      root: starter/
      glob: "*.{js,ts,cjs,mjs,mts,cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
